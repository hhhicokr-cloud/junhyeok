  async get(key) {
    const u = this.url();
    if (u) {
      const r = await fetch(u + "?key=" + encodeURIComponent(key), { redirect: "follow" });
      const j = await r.json();
      if (!j || typeof j.value !== "string") throw new Error("empty");
      return { value: j.value };
    }
    const v = localStorage.getItem(key);
    if (v === null) throw new Error("empty");
    return { value: v };
  },
  async set(key, value) {
    const u = this.url();
    if (u) {
      await fetch(u, {
        method: "POST", redirect: "follow",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ key, value }),
      });
      return true;
    }

const pad = (n) => String(n).padStart(2, "0");
const dkey = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
const skey = (dk, h) => `${dk}_${h}`;
const cohortOf = (s) => `${s.year}-${pad(s.month)}`;
const uid = () => Math.random().toString(36).slice(2, 10);
function numOrNull(v) {
  if (v === "" || v === null || v === undefined) return null;
  const n = Number(v);
  return isNaN(n) ? null : n;
}

function buildDays(s) {
  const out = [];
  for (let d = s.startDay; d <= s.endDay; d++) {
    const dt = new Date(s.year, s.month - 1, d);
    if (isNaN(dt)) continue;
    const dow = dt.getDay();
    if (!s.includeWeekends && (dow === 0 || dow === 6)) continue;
    if ((s.excludeDays || []).includes(d)) continue;
    out.push({ d, dow, key: dkey(s.year, s.month, d) });
  }
  return out;
}

function rateOf(student, att, sessions, rules) {
  const rec = att[student.id] || {};
  let den = 0, num = 0, absent = 0, late = 0;
  sessions.forEach((s) => {
    const v = rec[s.key];
    if (v === "V") return;              // 공결은 분모 제외
    if (!v) return;                     // 미체크는 아직 미집계
    den++;
    if (v === "P") num++;
    else if (v === "L") { late++; if (rules.lateAsPresent) num++; }
    else if (v === "A") absent++;
  });
  return { den, num, absent, late, rate: den ? Math.round((num / den) * 100) : null };
}

/** 여러 명이 동시에 쓸 때, 내가 건드린 부분만 원격 데이터 위에 얹는다 */
function freshTouch() {
  return { att: new Set(), students: new Set(), removed: new Set(), mocks: new Set(), meta: false, full: false };
}
function hasTouch(t) {
  return t.full || t.meta || t.att.size > 0 || t.students.size > 0 || t.removed.size > 0 || t.mocks.size > 0;
}
function mergeState(remote, local, t) {
  if (!remote || t.full) return local;
  const out = {
    students: [...(remote.students || [])],
    att: { ...(remote.att || {}) },
    mocks: { ...(remote.mocks || {}) },
    schedule: t.meta ? local.schedule : (remote.schedule || local.schedule),
    rules: t.meta ? local.rules : (remote.rules || local.rules),
    targets: t.meta ? local.targets : (remote.targets || local.targets),
    access: t.meta ? local.access : (remote.access || local.access),
  };
  const byId = new Map(out.students.map((x) => [x.id, x]));
  t.students.forEach((id) => {
    const found = local.students.find((x) => x.id === id);
    if (found) byId.set(id, found);
  });
  t.removed.forEach((id) => byId.delete(id));
  out.students = [...byId.values()];
  t.att.forEach((k) => {
    const i = k.indexOf("|");
    const sid = k.slice(0, i), key = k.slice(i + 1);
    const rec = { ...(out.att[sid] || {}) };
    const v = (local.att[sid] || {})[key];
    if (v) rec[key] = v; else delete rec[key];
    out.att[sid] = rec;
  });
  t.mocks.forEach((k) => {
    const i = k.indexOf("|");
    const sid = k.slice(0, i), mid = k.slice(i + 1);
    out.mocks[sid] = { ...(out.mocks[sid] || {}), [mid]: (local.mocks[sid] || {})[mid] };
  });
  t.removed.forEach((id) => { delete out.att[id]; delete out.mocks[id]; });
  return out;
}

/** 업로드 양식을 그대로 초기 데이터로 만든다 */
function buildImport(sch, prevTargets) {
  const ck = cohortOf(sch);
  const students = [], att = {};
  IMPORT_ROWS.forEach(([branch, name, recruiter, marks, note]) => {
    const id = uid();
    const status = note === "탈락" ? "dropped" : note === "자가학습" ? "self" : "active";
    students.push({
      id, cohort: ck, name, branch, recruiter, status,
      dropReason: "", dropDate: "", examSon: "", examThird: "",
      memo: note === "자가학습" ? "자가학습" : "",
    });
    if (status === "self") return;
    const rec = {};
    IMPORT_DAYS.forEach((d, i) => {
      ["am", "pm"].forEach((h, j) => {
        const ch = marks[i * 2 + j];
        if (ch === "P" || ch === "A") rec[skey(dkey(sch.year, sch.month, d), h)] = ch;
      });
    });
    att[id] = rec;
  });
  const targets = {};
  Object.entries(IMPORT_TARGETS).forEach(([b, g]) => {
    targets[b] = { goal: g, prePass: IMPORT_PREPASS[b] || 0 };
  });
  return { cohort: ck, students, att, targets };
}

/** 엑셀에서 복사한 표를 읽는다 */
function splitRows(text) {
  return String(text || "").split(/\r?\n/).map((l) => l.trim()).filter(Boolean)
    .map((l) => l.split(/\t|,/).map((c) => c.replace(/^"|"$/g, "").trim()));
}

function parseRoster(text, sch) {
  const days = buildDays(sch);
  const sessions = days.flatMap((d) => [skey(d.key, "am"), skey(d.key, "pm")]);
  const students = [], att = {}, skipped = [];
  splitRows(text).forEach((cells) => {
    const branch = cells[0], name = cells[1];
    if (!ALL_BRANCHES.includes(branch) || !name || name === "교육생" || name === "이름") {
      if (branch && !ALL_BRANCHES.includes(branch)) skipped.push(branch);
      return;
    }
    const rest = cells.slice(3);
    const note = rest.find((c) => c === "탈락" || c === "자가학습") || "";
    const marks = rest.filter((c) => c === "0" || c === "1");
    const id = uid();
    const status = note === "탈락" ? "dropped" : note === "자가학습" ? "self" : "active";
    students.push({
      id, cohort: cohortOf(sch), name, branch, recruiter: cells[2] || "", status,
      dropReason: "", dropDate: "", examSon: "", examThird: "",
      memo: note === "자가학습" ? "자가학습" : "",
    });
    if (status !== "self" && marks.length) {
      const rec = {};
      marks.forEach((m, i) => { if (sessions[i]) rec[sessions[i]] = m === "1" ? "P" : "A"; });
      att[id] = rec;
    }
  });
  return { students, att, skipped };
}

function parseTargets(text) {
  const out = {}; let n = 0;
  splitRows(text).forEach((cells) => {
    const b = cells[0];
    if (!ALL_BRANCHES.includes(b)) return;
    const g = parseInt(cells[1], 10), p = parseInt(cells[2], 10);
    out[b] = { goal: isNaN(g) ? 0 : g, prePass: isNaN(p) ? 0 : p };
    n++;
  });
  return { targets: out, count: n };
}

/* ─────────────────────────  작은 UI 조각  ───────────────────────── */
function Pill({ children, color, bg, bold }) {
  return (
    <span style={{
      color, background: bg, fontWeight: bold ? 700 : 600, fontSize: 11,
      padding: "2px 7px", borderRadius: 999, whiteSpace: "nowrap",

function Modal({ open, onClose, title, children, wide }) {
  if (!open) return null;
  return (
    <div onClick={onClose} className="fixed inset-0 z-50 flex items-end justify-center sm:items-center"
      style={{ background: "rgba(16,31,29,0.45)" }}>
      <div onClick={(e) => e.stopPropagation()}
        className="w-full overflow-y-auto"
        style={{
          maxWidth: wide ? 620 : 460, maxHeight: "88vh", background: C.surface,
          borderTopLeftRadius: 18, borderTopRightRadius: 18,
          borderBottomLeftRadius: 18, borderBottomRightRadius: 18,

function Btn({ children, onClick, tone = "ghost", size = "md", full, disabled }) {

        ...tones[tone], borderRadius: 10, fontWeight: 700,

/* ─────────────────────────  본체  ───────────────────────── */
function App() {
  const [loaded, setLoaded] = useState(false);
  const [students, setStudents] = useState([]);
  const [att, setAtt] = useState({});
  const [mocks, setMocks] = useState({});
  const [schedule, setSchedule] = useState(DEFAULT_SCHEDULE);
  const [rules, setRules] = useState(DEFAULT_RULES);
  const [targets, setTargets] = useState({});
  const [access, setAccess] = useState({ enabled: true, code: "1234", adminCode: "9999" });
  const [isAdmin, setIsAdmin] = useState(false);
  const [adminPrompt, setAdminPrompt] = useState(null);
  const [unlocked, setUnlocked] = useState(false);
  const [targetEdit, setTargetEdit] = useState(null);
  const [syncAt, setSyncAt] = useState(null);
  const [syncing, setSyncing] = useState(false);
  const touch = useRef(freshTouch());
  const lastRaw = useRef(null);
  const skipSave = useRef(false);
  const [view, setView] = useState("sheet");
  const [tab, setTab] = useState("all");
  const [q, setQ] = useState("");
  const [editing, setEditing] = useState(null);
  const [confirm, setConfirm] = useState(null);
  const [csv, setCsv] = useState(null);
  const [toast, setToast] = useState("");
  const [colMenu, setColMenu] = useState(null);
  const saveTimer = useRef(null);

  /* 폰트 */
  useEffect(() => {
    const l = document.createElement("link");
    l.rel = "stylesheet";
    l.href = "https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css";
    document.head.appendChild(l);
  }, []);

  /* 불러오기 */
  useEffect(() => {
    (async () => {
      try {
        const r = await Store.get(STORE_KEY);
        lastRaw.current = r.value;
        const d = JSON.parse(r.value);
        setStudents(d.students || []);
        setAtt(d.att || {});
        setMocks(d.mocks || {});
        setSchedule({ ...DEFAULT_SCHEDULE, ...(d.schedule || {}) });
        setRules({ ...DEFAULT_RULES, ...(d.rules || {}) });
        setTargets(d.targets || {});
        if (d.access) setAccess(d.access);
      } catch (e) { /* 첫 실행 */ }
      setStudents((prev) => {
        if (prev.length > 0) return prev;
        const base = buildImport(DEFAULT_SCHEDULE);
        setAtt((a) => (Object.keys(a).length ? a : base.att));
        setTargets((t) => (Object.keys(t).length ? t : { [base.cohort]: base.targets }));
        return base.students;
      });
      setLoaded(true);
    })();
  }, []);

  /* 저장 */
  useEffect(() => {
    if (!loaded) return;
    clearTimeout(saveTimer.current);
    if (skipSave.current) { skipSave.current = false; return; }
    saveTimer.current = setTimeout(async () => {
      const local = { students, att, mocks, schedule, rules, targets, access };
      let remote = null;
      try {
        const r = await Store.get(STORE_KEY);
        remote = JSON.parse(r.value);
      } catch (e) { /* 아직 없음 */ }
      const merged = mergeState(remote, local, touch.current);
      const raw = JSON.stringify(merged);
      try {
        await Store.set(STORE_KEY, raw);
        lastRaw.current = raw;
        touch.current = freshTouch();
        setSyncAt(new Date());
        if (raw !== JSON.stringify(local)) {
          skipSave.current = true;
          setStudents(merged.students); setAtt(merged.att); setMocks(merged.mocks);
          setSchedule(merged.schedule); setRules(merged.rules);
          setTargets(merged.targets); setAccess(merged.access);
        }
      } catch (e) { setToast("저장에 실패했습니다. 잠시 후 다시 시도하세요."); }
    }, 500);
  }, [students, att, mocks, schedule, rules, targets, access, loaded]);

  /* 다른 사람이 바꾼 내용 주기적으로 가져오기 */
  const pull = useCallback(async (manual) => {
    if (manual) setSyncing(true);
    try {
      const r = await Store.get(STORE_KEY);
      if (r.value !== lastRaw.current) {
        lastRaw.current = r.value;
        const d = JSON.parse(r.value);
        skipSave.current = true;
        setStudents(d.students || []); setAtt(d.att || {}); setMocks(d.mocks || {});
        setSchedule({ ...DEFAULT_SCHEDULE, ...(d.schedule || {}) });
        setRules({ ...DEFAULT_RULES, ...(d.rules || {}) });
        setTargets(d.targets || {});
        if (d.access) setAccess(d.access);
        if (manual) setToast("최신 내용을 가져왔습니다.");
      } else if (manual) setToast("이미 최신 상태입니다.");
      setSyncAt(new Date());
    } catch (e) { if (manual) setToast("동기화하지 못했습니다."); }
    if (manual) setSyncing(false);
  }, []);

  useEffect(() => {
    if (!loaded) return;
    const iv = setInterval(() => { if (!hasTouch(touch.current)) pull(false); }, 12000);
    return () => clearInterval(iv);
  }, [loaded, pull]);

  useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(""), 2200); return () => clearTimeout(t); }, [toast]);

  /* 파생값 */
  const cohort = cohortOf(schedule);
  const days = useMemo(() => buildDays(schedule), [schedule]);
  const sessions = useMemo(
    () => days.flatMap((d) => [
      { key: skey(d.key, "am"), day: d, half: "am", label: "오전" },
      { key: skey(d.key, "pm"), day: d, half: "pm", label: "오후" },
    ]), [days]);

  const todayKey = useMemo(() => {
    const n = new Date();
    return dkey(n.getFullYear(), n.getMonth() + 1, n.getDate());
  }, []);
  const isTrainingToday = days.some((d) => d.key === todayKey);

  const cohortStudents = useMemo(
    () => students.filter((s) => s.cohort === cohort), [students, cohort]);

  const stats = useMemo(() => {
    const m = {};
    ALL_BRANCHES.forEach((b) => (m[b] = {
      branch: b, total: 0, dropped: 0, active: 0, self: 0,
      todayAm: 0, todayPm: 0, todayAny: 0, rateSum: 0, rateN: 0, risk: 0, pass: 0,
    }));
    cohortStudents.forEach((s) => {
      const o = m[s.branch]; if (!o) return;
      o.total++;
      if (judge(s.examSon, s.examThird) === "합격") o.pass++;
      if (s.status === "dropped") { o.dropped++; return; }
      if (s.status === "self") { o.self++; return; }
      o.active++;
      const rec = att[s.id] || {};
      const am = rec[skey(todayKey, "am")], pm = rec[skey(todayKey, "pm")];
      const ok = (v) => v === "P" || v === "L";
      if (ok(am)) o.todayAm++;
      if (ok(pm)) o.todayPm++;
      if (ok(am) || ok(pm)) o.todayAny++;
      const r = rateOf(s, att, sessions, rules);
      if (r.rate !== null) { o.rateSum += r.rate; o.rateN++; }
      if (r.absent >= rules.absentLimit || (r.rate !== null && r.den >= 2 && r.rate < rules.passRate)) o.risk++;
    });
    Object.values(m).forEach((o) => {
      o.rate = o.rateN ? Math.round(o.rateSum / o.rateN) : null;
      const t = (targets[cohort] || {})[o.branch] || {};
      o.goal = +t.goal || 0;
      o.prePass = +t.prePass || 0;
      o.ontime = o.pass;
      o.totalPass = o.prePass + o.ontime;
      o.achieve = o.goal ? Math.round((o.totalPass / o.goal) * 100) : null;
    });
    return m;
  }, [cohortStudents, att, sessions, rules, todayKey, targets, cohort]);

  const centerStats = useMemo(() => {
    const out = {};
    CENTERS.forEach((c) => {
      const rows = c.branches.map((b) => stats[b]);
      const acc = { total: 0, dropped: 0, active: 0, self: 0, todayAny: 0, todayAm: 0, todayPm: 0, risk: 0, pass: 0, rateSum: 0, rateN: 0, goal: 0, prePass: 0 };
      rows.forEach((r) => {
        acc.total += r.total; acc.dropped += r.dropped; acc.active += r.active; acc.self += r.self;
        acc.todayAny += r.todayAny; acc.todayAm += r.todayAm; acc.todayPm += r.todayPm;
        acc.risk += r.risk; acc.pass += r.pass; acc.rateSum += r.rateSum; acc.rateN += r.rateN;
        acc.goal += r.goal; acc.prePass += r.prePass;
      });
      acc.rate = acc.rateN ? Math.round(acc.rateSum / acc.rateN) : null;
      acc.ontime = acc.pass;
      acc.totalPass = acc.prePass + acc.ontime;
      acc.achieve = acc.goal ? Math.round((acc.totalPass / acc.goal) * 100) : null;
      out[c.id] = acc;
    });
    const tot = { total: 0, dropped: 0, active: 0, self: 0, todayAny: 0, todayAm: 0, todayPm: 0, risk: 0, pass: 0, rateSum: 0, rateN: 0, goal: 0, prePass: 0 };
    Object.values(out).forEach((a) => {
      tot.total += a.total; tot.dropped += a.dropped; tot.active += a.active; tot.self += a.self;
      tot.todayAny += a.todayAny; tot.todayAm += a.todayAm; tot.todayPm += a.todayPm;
      tot.risk += a.risk; tot.pass += a.pass; tot.rateSum += a.rateSum; tot.rateN += a.rateN;
      tot.goal += a.goal; tot.prePass += a.prePass;
    });
    tot.rate = tot.rateN ? Math.round(tot.rateSum / tot.rateN) : null;
    tot.ontime = tot.pass;
    tot.totalPass = tot.prePass + tot.ontime;
    tot.achieve = tot.goal ? Math.round((tot.totalPass / tot.goal) * 100) : null;
    out.all = tot;
    return out;
  }, [stats]);

  const visibleBranches = tab === "all" ? ALL_BRANCHES : CENTERS.find((c) => c.id === tab).branches;
  const visibleStudents = useMemo(() => {
    const t = q.trim();
    return cohortStudents
      .filter((s) => visibleBranches.includes(s.branch))
      .filter((s) => !t || s.name.includes(t) || s.branch.includes(t) || (s.recruiter || "").includes(t))
      .sort((a, b) => {
        const rank = (x) => (x.status === "dropped" ? 2 : x.status === "self" ? 1 : 0);
        return rank(a) - rank(b)
          || ALL_BRANCHES.indexOf(a.branch) - ALL_BRANCHES.indexOf(b.branch)
          || a.name.localeCompare(b.name, "ko");
      });
  }, [cohortStudents, visibleBranches, q]);

  /* 동작 */
  const cycle = useCallback((sid, key) => {
    touch.current.att.add(`${sid}|${key}`);
    setAtt((p) => {
      const rec = { ...(p[sid] || {}) };
      const cur = rec[key] || "";
      const nxt = CYCLE[(CYCLE.indexOf(cur) + 1) % CYCLE.length];
      if (nxt) rec[key] = nxt; else delete rec[key];
      return { ...p, [sid]: rec };
    });
  }, []);

  const bulkSession = (key, val) => {
    setAtt((p) => {
      const n = { ...p };
      visibleStudents.forEach((s) => {
        if (s.status !== "active") return;
        touch.current.att.add(`${s.id}|${key}`);
        const rec = { ...(n[s.id] || {}) };
        if (val) rec[key] = val; else delete rec[key];
        n[s.id] = rec;
      });
      return n;
    });
    setColMenu(null);
    setToast(val ? `해당 교시를 일괄 ${ST[val].label} 처리했습니다.` : "해당 교시 체크를 지웠습니다.");
  };

  const markMeta = (fn) => (v) => { touch.current.meta = true; fn(v); };

  const applyPaste = (mode, text) => {
    if (mode === "targets") {
      const { targets: t, count } = parseTargets(text);
      if (!count) { setToast("점포명을 찾지 못했습니다. 첫 칸이 점포명인지 확인하세요."); return; }
      touch.current.meta = true;
      setTargets((p) => ({ ...p, [cohort]: { ...(p[cohort] || {}), ...t } }));
      setToast(`${count}개 점포의 목표를 반영했습니다.`);
      return;
    }
    const { students: list, att: a2, skipped } = parseRoster(text, schedule);
    if (!list.length) { setToast("교육생을 찾지 못했습니다. 첫 칸 점포명, 둘째 칸 이름인지 확인하세요."); return; }
    touch.current.full = true;
    setStudents((p) => [...p.filter((x) => x.cohort !== cohort), ...list]);
    setAtt((p) => {
      const n = { ...p };
      list.forEach((x) => { if (a2[x.id]) n[x.id] = a2[x.id]; });
      return n;
    });
    setToast(`교육생 ${list.length}명을 등록했습니다.` + (skipped.length ? ` (알 수 없는 점포 ${skipped.length}줄 제외)` : ""));
  };

  const saveTarget = (branch, goal, prePass) => (touch.current.meta = true, setTargets((p) => ({
    ...p,
    [cohort]: { ...(p[cohort] || {}), [branch]: { goal: +goal || 0, prePass: +prePass || 0 } },
  })));

  const saveStudent = (s) => {
    touch.current.students.add(s.id);
    setStudents((p) => (p.some((x) => x.id === s.id) ? p.map((x) => (x.id === s.id ? s : x)) : [...p, s]));
    setEditing(null);
  };
  const removeStudent = (id) => {
    touch.current.removed.add(id);
    setStudents((p) => p.filter((x) => x.id !== id));
    setAtt((p) => { const n = { ...p }; delete n[id]; return n; });
    setEditing(null); setConfirm(null);
    setToast("교육생을 삭제했습니다.");
  };
  const setMockScore = (sid, mid, field, value) => (touch.current.mocks.add(`${sid}|${mid}`), setMocks((p) => {
    const rec = { ...(p[sid] || {}) };
    rec[mid] = { ...(rec[mid] || {}), [field]: value };
    return { ...p, [sid]: rec };
  }));

  const exportCsv = () => {
    const rounds = schedule.mockExams || [];
    const head = ["기수", "센터", "점포", "이름", "유치자", "상태", "탈락사유",
      ...sessions.map((s) => `${schedule.month}/${s.day.d}(${DOW[s.day.dow]}) ${s.label}`),
      "출석률(%)", "결석", "지각",
      ...rounds.flatMap((m) => [`모의 ${m.label} 손보`, `모의 ${m.label} 제3`, `모의 ${m.label} 판정`]),
      "시험 손보", "시험 제3", "시험 판정", "메모", "점포 목표", "점포 기합격"];
    const rows = cohortStudents.map((s) => {
      const rec = att[s.id] || {};
      const mk = mocks[s.id] || {};
      const r = rateOf(s, att, sessions, rules);
      return [cohort, BRANCH_CENTER[s.branch]?.name || "", s.branch, s.name, s.recruiter || "",
        s.status === "dropped" ? "탈락" : s.status === "self" ? "자가학습" : "교육중", s.dropReason || "",
        ...sessions.map((x) => (rec[x.key] ? ST[rec[x.key]].label : "")),
        r.rate ?? "", r.absent, r.late,
        ...rounds.flatMap((m) => {
          const v = mk[m.id] || {};
          return [v.son ?? "", v.third ?? "", judge(v.son, v.third)];
        }),
        s.examSon ?? "", s.examThird ?? "", judge(s.examSon, s.examThird),
        (s.memo || "").replace(/\n/g, " "),
        ((targets[cohort] || {})[s.branch] || {}).goal ?? "",
        ((targets[cohort] || {})[s.branch] || {}).prePass ?? ""];
    });
    const text = [head, ...rows]
      .map((r) => r.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\n");
    setCsv("\uFEFF" + text);
  };

  const seed = () => {
    touch.current.full = true;
    const base = buildImport(schedule, targets[cohort]);
    setTargets((p) => ({ ...p, [base.cohort]: { ...(p[base.cohort] || {}), ...base.targets } }));
    setStudents((p) => [...p.filter((x) => x.cohort !== base.cohort), ...base.students]);
    setAtt((p) => ({ ...p, ...base.att }));
    setToast(`양식 데이터 ${base.students.length}명과 점포 목표를 불러왔습니다.`);
  };

  if (!loaded) {
    return <div className="min-h-screen flex items-center justify-center" style={{ background: C.bg, color: C.muted, fontSize: 14 }}>불러오는 중…</div>;
  }

  const font = "'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', system-ui, sans-serif";

  if (access.enabled && !unlocked) {

      onPass={(admin) => { setUnlocked(true); setIsAdmin(admin); }} />;

          </div>
        </div>
        <div className="flex gap-2 mt-3 items-center" style={{ fontSize: 11.5 }}>

          <button onClick={() => pull(true)}

      </Modal>

      {toast && (

            {toast}
          </div>
        </div>
      )}
    </div>
  );
}

/* ─────────────────────────  접속 코드  ───────────────────────── */
function Gate({ font, code, adminCode, onPass }) {
  const [buf, setBuf] = useState("");
  const [err, setErr] = useState(false);
  const user = String(code || ""), admin = String(adminCode || "");
  const maxLen = Math.max(user.length, admin.length, 4);

  const push = (d) => {
    if (buf.length >= maxLen) return;
    const next = buf + d;
    setBuf(next); setErr(false);
    if (next === admin) { setTimeout(() => onPass(true), 120); return; }
    if (next === user) { setTimeout(() => onPass(false), 120); return; }
    if (next.length >= maxLen) setTimeout(() => { setErr(true); setBuf(""); }, 130);
  };

  return (
    <div style={{
      minHeight: "100vh", background: C.brand, fontFamily: font, color: "#fff",
      display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 24,
    }}>
      <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: "0.16em", opacity: 0.7 }}>현대해상 경인지역단</div>
      <h1 style={{ fontSize: 22, fontWeight: 800, letterSpacing: "-0.03em", marginTop: 4 }}>교육 출결 관리</h1>
      <p style={{ fontSize: 12.5, opacity: 0.75, marginTop: 10, marginBottom: 22 }}>
        {err ? "코드가 맞지 않습니다. 다시 입력하세요." : "접속 코드를 입력하세요"}
      </p>

      <div className="flex gap-3" style={{ marginBottom: 30, height: 14 }}>
        {Array.from({ length: maxLen }).map((_, i) => (
          <span key={i} style={{
            width: 13, height: 13, borderRadius: 999,
            background: i < buf.length ? "#fff" : "rgba(255,255,255,0.28)",
            border: err ? "1px solid rgba(255,255,255,0.6)" : "none",
          }} />
        ))}
      </div>

      <div className="grid grid-cols-3 gap-3" style={{ width: 240 }}>
        {["1", "2", "3", "4", "5", "6", "7", "8", "9", "", "0", "←"].map((k, i) => (
          k === "" ? <div key={i} /> : (
            <button key={i}
              onClick={() => (k === "←" ? (setBuf(buf.slice(0, -1)), setErr(false)) : push(k))}
              style={{
                height: 62, borderRadius: 999, fontSize: k === "←" ? 18 : 22, fontWeight: 700, color: "#fff",
                background: k === "←" ? "transparent" : "rgba(255,255,255,0.14)",
              }}>{k}</button>
          )
        ))}
      </div>
    </div>
  );
}

/* ─────────────────────────  탭  ───────────────────────── */

          <span>자가학습 {head.self}명</span>
          {head.risk > 0 && (<><span style={{ color: C.line }}>|</span>
            <span style={{ color: "#C97A05" }}>관리필요 {head.risk}명</span></>)}
        </div>
      </div>

      {/* 센터별 요약 (종합 탭) */}
      {tab === "all" && (
        <div style={{ background: C.surface, border: `1px solid ${C.line}`, borderRadius: 14, overflow: "hidden", marginBottom: 8 }}>
          <div className="px-3 py-2.5" style={{ borderBottom: `1px solid ${C.line}`, fontSize: 12.5, fontWeight: 800 }}>
            센터별 현황
          </div>
          <StatTable rows={CENTERS.map((c) => ({ ...centerStats[c.id], branch: c.name }))}
            isTrainingToday={isTrainingToday} achColor={achColor} strong />
        </div>
      )}

      {/* 점포별 현황표 */}
      <div style={{ background: C.surface, border: `1px solid ${C.line}`, borderRadius: 14, overflow: "hidden" }}>
        <div className="flex items-center justify-between px-3 py-2.5" style={{ borderBottom: `1px solid ${C.line}` }}>
          <span style={{ fontSize: 12.5, fontWeight: 800 }}>점포별 현황</span>
          <span style={{ fontSize: 10.5, color: C.muted, fontWeight: 600 }}>점포명을 누르면 목표·기합격 수정</span>
        </div>
        <StatTable rows={branches.map((b) => stats[b])} isTrainingToday={isTrainingToday}
          achColor={achColor} onRow={onEditTarget} />
      </div>
    </section>
  );
}

const STAT_COLS = [["점포", 62, "left"], ["목표", 32], ["접수", 32], ["교육중", 40], ["자가", 32],
  ["탈락", 32], ["오늘", 32], ["기합격", 40], ["정시", 32], ["합계", 34], ["달성", 42]];

function StatTable({ rows, isTrainingToday, achColor, onRow, strong }) {
  return (
    <div style={{ overflowX: "auto", WebkitOverflowScrolling: "touch" }}>
      <table style={{ borderCollapse: "separate", borderSpacing: 0, fontVariantNumeric: "tabular-nums", width: "100%" }}>
        <thead>
          <tr>
            {STAT_COLS.map(([l, w, al], i) => (
              <th key={l} style={{

            ))}

        </thead>

                <td onClick={() => onRow && onRow(s.branch)} style={{

/* ─────────────────────────  출결 시트  ───────────────────────── */

    return (
      <div style={{ background: C.surface, border: `1px dashed ${C.line}`, borderRadius: 14, padding: "34px 20px", textAlign: "center" }}>
        <ListChecks size={26} color={C.muted} style={{ margin: "0 auto 10px" }} />
        <p style={{ fontSize: 14, fontWeight: 700, marginBottom: 4 }}>등록된 교육생이 없습니다</p>

  });

  return (
    <div style={{ background: C.surface, border: `1px solid ${C.line}`, borderRadius: 14, overflow: "hidden" }}>
      <div className="flex items-center justify-between px-3 py-2.5" style={{ borderBottom: `1px solid ${C.line}` }}>
        <span style={{ fontSize: 12.5, fontWeight: 800 }}>출결 시트</span>
        <div className="flex gap-1.5">
          {Object.entries(ST).map(([k, v]) => (
            <span key={k} style={{ fontSize: 10, fontWeight: 700, color: v.c, background: v.bg, padding: "2px 6px", borderRadius: 5 }}>
              {v.s} {v.label}

          ))}
        </div>
      </div>

      <div ref={scroller} style={{ overflowX: "auto", WebkitOverflowScrolling: "touch" }}>

                const today = d.key === todayKey;
                return (
                  <th key={d.key} colSpan={2} style={{
                    minWidth: CELLW * 2, padding: "5px 0", fontSize: 11, fontWeight: 800,
                    background: today ? C.brandSoft : C.surface, color: today ? C.brandInk : C.ink2,
                    borderBottom: `1px solid ${C.line2}`, borderLeft: `1px solid ${C.line}`,
                  }}>
                    {d.d}<span style={{ fontSize: 9.5, fontWeight: 600, opacity: 0.7 }}> {DOW[d.dow]}</span>
                  </th>

              })}

                minWidth: 70, fontSize: 10.5, fontWeight: 800, color: C.ink2, padding: "6px 4px",
                borderLeft: `2px solid ${C.line}`, borderBottom: `1px solid ${C.line}`, background: "#FAFCFB",

            </tr>
            <tr>
              {sessions.map((s) => {
                const today = s.day.key === todayKey;
                return (
                  <th key={s.key} onClick={() => onHeader(s)}
                    style={{
                      minWidth: CELLW, width: CELLW, padding: "3px 0", cursor: "pointer",
                      background: today ? C.brandSoft : C.surface,
                      borderLeft: `1px solid ${s.half === "am" ? C.line : C.line2}`,
                      borderBottom: `1px solid ${C.line}`,
                    }}>
                    <div style={{ fontSize: 9.5, fontWeight: 700, color: today ? C.brandInk : C.muted }}>{s.half === "am" ? "오전" : "오후"}</div>

                      textAlign: "center", padding: 0, borderLeft: `2px solid ${C.line}`,

                      return (
                        <div>
                          <span style={{
                            fontSize: 9.5, fontWeight: 800, color: EXAM[j].c,

      <div className="px-3 py-2.5" style={{ borderTop: `1px solid ${C.line2}`, fontSize: 11, color: C.muted, lineHeight: 1.55 }}>

      </div>
    </div>
  );
}

/* ─────────────────────────  빠른 체크  ───────────────────────── */
function QuickCheck({ days, todayKey, students, att, setAtt, schedule }) {
  const idx0 = Math.max(0, days.findIndex((d) => d.key === todayKey));
  const [di, setDi] = useState(idx0 === -1 ? 0 : idx0);
  const [half, setHalf] = useState(new Date().getHours() < 13 ? "am" : "pm");
  const [branch, setBranch] = useState("전체");
  const day = days[di];

  if (!day) return <Empty text="교육 일정이 없습니다. 설정에서 교육 기간을 확인하세요." />;
  const key = skey(day.key, half);
  const list = students
    .filter((s) => s.status === "active")
    .filter((s) => branch === "전체" || s.branch === branch)
    .sort((a, b) => ALL_BRANCHES.indexOf(a.branch) - ALL_BRANCHES.indexOf(b.branch) || a.name.localeCompare(b.name, "ko"));
  const done = list.filter((s) => (att[s.id] || {})[key]).length;

  const set = (id, v) => setAtt((p) => {
    const rec = { ...(p[id] || {}) };
    if (rec[key] === v) delete rec[key]; else rec[key] = v;
    return { ...p, [id]: rec };
  });

  return (
    <div>
      <div style={{ background: C.surface, border: `1px solid ${C.line}`, borderRadius: 14, padding: 12, marginBottom: 10 }}>
        <div className="flex items-center justify-between mb-2.5">
          <button onClick={() => setDi(Math.max(0, di - 1))} disabled={di === 0}
            style={{ color: di === 0 ? C.line : C.ink2, padding: 4 }}><ChevronLeft size={20} /></button>
          <div className="text-center">
            <div style={{ fontSize: 16, fontWeight: 800, letterSpacing: "-0.02em" }}>
              {schedule.month}월 {day.d}일 <span style={{ color: C.muted, fontWeight: 700 }}>({DOW[day.dow]})</span>
            </div>
            {day.key === todayKey && <div style={{ fontSize: 10.5, color: C.brand, fontWeight: 800 }}>오늘</div>}
          </div>
          <button onClick={() => setDi(Math.min(days.length - 1, di + 1))} disabled={di === days.length - 1}
            style={{ color: di === days.length - 1 ? C.line : C.ink2, padding: 4 }}><ChevronRight size={20} /></button>
        </div>
        <div className="flex gap-2 mb-2">
          {[["am", "오전"], ["pm", "오후"]].map(([k, l]) => (
            <button key={k} onClick={() => setHalf(k)} className="flex-1"
              style={{
                padding: "9px 0", borderRadius: 10, fontSize: 13.5, fontWeight: 800,
                background: half === k ? C.brand : C.brandSoft, color: half === k ? "#fff" : C.brandInk,
              }}>{l}</button>
          ))}
        </div>
        <select value={branch} onChange={(e) => setBranch(e.target.value)} style={{ ...inputStyle, padding: "8px 10px", fontSize: 13 }}>
          <option>전체</option>
          {CENTERS.map((c) => (
            <optgroup key={c.id} label={c.name}>
              {c.branches.map((b) => <option key={b}>{b}</option>)}
            </optgroup>
          ))}
        </select>
        <div className="mt-2 text-center" style={{ fontSize: 11.5, color: C.muted, fontWeight: 700 }}>
          {list.length}명 중 {done}명 체크 완료
        </div>
      </div>

      {list.length === 0 ? <Empty text="해당 조건의 교육생이 없습니다." /> : (
        <div style={{ background: C.surface, border: `1px solid ${C.line}`, borderRadius: 14, overflow: "hidden" }}>
          {list.map((s, i) => {
            const v = (att[s.id] || {})[key];
            return (
              <div key={s.id} className="flex items-center gap-2 px-3 py-2"
                style={{ borderTop: i ? `1px solid ${C.line2}` : "none" }}>
                <div className="flex-1 min-w-0">
                  <div style={{ fontSize: 13.5, fontWeight: 700 }}>{s.name}</div>
                  <div style={{ fontSize: 10.5, color: C.muted, fontWeight: 600 }}>{s.branch}</div>
                </div>
                <div className="flex gap-1">
                  {["P", "L", "A", "V"].map((k) => (
                    <button key={k} onClick={() => set(s.id, k)}
                      style={{
                        width: 38, height: 34, borderRadius: 9, fontSize: 12.5, fontWeight: 800,
                        background: v === k ? ST[k].c : ST[k].bg, color: v === k ? "#fff" : ST[k].c,
                      }}>{ST[k].s}</button>
                  ))}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

/* ─────────────────────────  모의고사  ───────────────────────── */
function MockView({ schedule, students, mocks, setScore, onEdit }) {
  const rounds = (schedule.mockExams || []).slice().sort((a, b) => a.day - b.day);
  const [ri, setRi] = useState(0);
  const [branch, setBranch] = useState("전체");
  const [only, setOnly] = useState("all");

  if (rounds.length === 0) {
    return <Empty text={"등록된 모의고사가 없습니다.\n설정 → 모의고사 일정에서 회차를 추가하세요."} />;
  }
  const round = rounds[Math.min(ri, rounds.length - 1)];

  const pool = students.filter((s) => s.status !== "dropped")
    .filter((s) => branch === "전체" || s.branch === branch)
    .sort((a, b) => ALL_BRANCHES.indexOf(a.branch) - ALL_BRANCHES.indexOf(b.branch) || a.name.localeCompare(b.name, "ko"));

  const scored = pool.map((s) => {
    const v = (mocks[s.id] || {})[round.id] || {};
    return { s, son: v.son ?? "", third: v.third ?? "", res: judge(v.son, v.third) };
  });
  const list = scored.filter((x) => (only === "all" ? true : only === "todo" ? !x.res : x.res === only));

  const done = scored.filter((x) => x.res);
  const cnt = { 합격: 0, 부분합격: 0, 불합격: 0 };
  done.forEach((x) => cnt[x.res]++);
  const avg = (k) => {
    const ns = done.map((x) => numOrNull(x[k])).filter((n) => n !== null);
    return ns.length ? Math.round(ns.reduce((a, b) => a + b, 0) / ns.length) : null;
  };

  return (
    <div>
      {/* 회차 선택 */}
      <div className="flex gap-1.5 mb-2.5 overflow-x-auto" style={{ scrollbarWidth: "none" }}>
        {rounds.map((m, i) => {
          const on = m.id === round.id;
          return (
            <button key={m.id} onClick={() => setRi(i)}
              style={{
                flex: "1 0 auto", minWidth: 84, padding: "9px 10px", borderRadius: 12, textAlign: "center",
                background: on ? C.brand : C.surface, color: on ? "#fff" : C.ink2,
                border: `1px solid ${on ? C.brand : C.line}`,
              }}>
              <div style={{ fontSize: 13, fontWeight: 800 }}>{m.label}</div>
              <div style={{ fontSize: 10.5, fontWeight: 600, opacity: on ? 0.85 : 0.7, fontVariantNumeric: "tabular-nums" }}>
                {schedule.month}/{m.day} {m.half === "am" ? "오전" : "오후"}
              </div>
            </button>
          );
        })}
      </div>

      {/* 회차 요약 */}
      <div style={{ background: C.surface, border: `1px solid ${C.line}`, borderRadius: 14, padding: "12px 14px", marginBottom: 8 }}>
        <div className="flex items-baseline justify-between mb-2.5">
          <h2 style={{ fontSize: 13.5, fontWeight: 800, letterSpacing: "-0.02em" }}>{round.label} 결과</h2>
          <span style={{ fontSize: 11, color: C.muted, fontWeight: 600, fontVariantNumeric: "tabular-nums" }}>
            응시 {done.length} / {pool.length}명
          </span>
        </div>
        <div className="grid grid-cols-4 gap-2">
          {[
            { l: "합격", v: cnt.합격, c: "#0B8F63" },
            { l: "부분합격", v: cnt.부분합격, c: "#C97A05" },
            { l: "불합격", v: cnt.불합격, c: "#CE3A38" },
            { l: "합격률", v: done.length ? `${Math.round((cnt.합격 / done.length) * 100)}%` : "–", c: C.brand },
          ].map((x) => (
            <div key={x.l} style={{ textAlign: "center" }}>
              <div style={{ fontSize: 20, fontWeight: 800, color: x.c, fontVariantNumeric: "tabular-nums", lineHeight: 1.15 }}>{x.v}</div>
              <div style={{ fontSize: 10.5, color: C.muted, fontWeight: 600 }}>{x.l}</div>
            </div>
          ))}
        </div>
        <div className="mt-2 pt-2 flex gap-3 justify-center"
          style={{ borderTop: `1px solid ${C.line2}`, fontSize: 11.5, color: C.ink2, fontWeight: 600 }}>
          <span>평균 손해보험 <b>{avg("son") ?? "–"}</b></span>
          <span style={{ color: C.line }}>|</span>
          <span>평균 제3보험 <b>{avg("third") ?? "–"}</b></span>
        </div>
      </div>

      {/* 필터 */}
      <div className="flex gap-2 mb-2">
        <select value={branch} onChange={(e) => setBranch(e.target.value)}
          style={{ ...inputStyle, padding: "7px 10px", fontSize: 12.5, flex: 1 }}>
          <option>전체</option>
          {CENTERS.map((c) => (
            <optgroup key={c.id} label={c.name}>{c.branches.map((b) => <option key={b}>{b}</option>)}</optgroup>
          ))}
        </select>
        <select value={only} onChange={(e) => setOnly(e.target.value)}
          style={{ ...inputStyle, padding: "7px 10px", fontSize: 12.5, width: 108 }}>
          <option value="all">전체</option>
          <option value="todo">미입력</option>
          <option value="합격">합격</option>
          <option value="부분합격">부분합격</option>
          <option value="불합격">불합격</option>
        </select>
      </div>

      {/* 점수 입력 */}
      {list.length === 0 ? <Empty text="해당 조건의 교육생이 없습니다." /> : (
        <div style={{ background: C.surface, border: `1px solid ${C.line}`, borderRadius: 14, overflow: "hidden" }}>
          <div className="flex items-center gap-2 px-3 py-2"
            style={{ borderBottom: `1px solid ${C.line}`, fontSize: 10.5, color: C.muted, fontWeight: 700 }}>
            <span style={{ flex: 1 }}>교육생</span>
            <span style={{ width: 50, textAlign: "center" }}>손해보험</span>
            <span style={{ width: 50, textAlign: "center" }}>제3보험</span>
            <span style={{ width: 54, textAlign: "center" }}>판정</span>
          </div>
          {list.map((x, i) => (
            <div key={x.s.id} className="flex items-center gap-2 px-3 py-2"
              style={{ borderTop: i ? `1px solid ${C.line2}` : "none" }}>
              <button onClick={() => onEdit(x.s)} className="text-left" style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: 13.5, fontWeight: 700 }}>{x.s.name}</div>
                <div style={{ fontSize: 10.5, color: C.muted, fontWeight: 600 }}>{x.s.branch}</div>
              </button>
              {[["son", x.son], ["third", x.third]].map(([k, val]) => {
                const n = numOrNull(val);
                const bad = n !== null && n < PASS_MARK;
                return (
                  <input key={k} type="number" inputMode="numeric" min={0} max={100} value={val}
                    onChange={(e) => {
                      const raw = e.target.value;
                      const nv = raw === "" ? "" : Math.max(0, Math.min(100, Number(raw)));
                      setScore(x.s.id, round.id, k, nv);
                    }}
                    style={{
                      width: 50, textAlign: "center", padding: "7px 2px", fontSize: 14, fontWeight: 700,
                      border: `1px solid ${n === null ? C.line : bad ? "#F0C3C1" : "#B7E2CE"}`,
                      background: n === null ? C.surface : bad ? "#FDF3F2" : "#F1FAF5",
                      color: n === null ? C.ink : bad ? "#CE3A38" : "#0B8F63",
                      borderRadius: 9, outline: "none", fontVariantNumeric: "tabular-nums",
                    }} />
                );
              })}
              <div style={{ width: 54, textAlign: "center" }}>
                <span style={{
                  fontSize: 10, fontWeight: 800, color: EXAM[x.res].c, background: EXAM[x.res].bg,
                  padding: "3px 5px", borderRadius: 6, display: "inline-block",
                }}>{x.res ? EXAM[x.res].label : "–"}</span>
              </div>
            </div>
          ))}
        </div>
      )}

      {/* 회차별 추이 */}
      {rounds.length > 1 && (
        <div style={{ background: C.surface, border: `1px solid ${C.line}`, borderRadius: 14, padding: 14, marginTop: 10 }}>
          <h3 style={{ fontSize: 13.5, fontWeight: 800, marginBottom: 10, letterSpacing: "-0.02em" }}>회차별 합격률</h3>
          {rounds.map((m) => {
            const res = pool.map((s) => {
              const v = (mocks[s.id] || {})[m.id] || {};
              return judge(v.son, v.third);
            }).filter(Boolean);
            const pass = res.filter((r) => r === "합격").length;
            const pct = res.length ? Math.round((pass / res.length) * 100) : 0;
            return (
              <div key={m.id} className="flex items-center gap-2 py-1.5">
                <span style={{ fontSize: 12, fontWeight: 700, width: 34 }}>{m.label}</span>
                <div style={{ flex: 1, height: 8, background: C.line2, borderRadius: 4, overflow: "hidden" }}>
                  <div style={{ width: `${pct}%`, height: "100%", background: C.brand }} />
                </div>
                <span style={{ fontSize: 11.5, fontWeight: 800, color: C.brand, width: 62, textAlign: "right", fontVariantNumeric: "tabular-nums" }}>
                  {res.length ? `${pct}% (${res.length})` : "–"}
                </span>
              </div>
            );
          })}
        </div>
      )}

      <p style={{ fontSize: 11, color: C.muted, lineHeight: 1.6, padding: "10px 4px 0" }}>
        두 과목 점수를 모두 입력하면 자동으로 판정됩니다. 손해보험·제3보험 모두 {PASS_MARK}점 이상이면 합격,
        한 과목만 넘으면 부분합격, 둘 다 미만이면 불합격입니다.
      </p>
    </div>
  );
}

/* ─────────────────────────  명단  ───────────────────────── */
function Roster({ students, att, sessions, rules, onEdit, onNew, q, setQ }) {
  const [filter, setFilter] = useState("all");
  const t = q.trim();
  const list = students
    .filter((s) => (filter === "all" ? true : filter === "drop" ? s.status === "dropped"
      : filter === "self" ? s.status === "self" : s.status === "active"))
    .filter((s) => !t || s.name.includes(t) || s.branch.includes(t) || (s.recruiter || "").includes(t))
    .sort((a, b) => ALL_BRANCHES.indexOf(a.branch) - ALL_BRANCHES.indexOf(b.branch) || a.name.localeCompare(b.name, "ko"));

  return (
    <div>
      <div className="flex gap-2 mb-2">
        <div className="flex-1 flex items-center gap-2"
          style={{ background: C.surface, border: `1px solid ${C.line}`, borderRadius: 10, padding: "0 10px" }}>
          <Search size={15} color={C.muted} />
          <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="이름 · 점포 · 유치자"
            style={{ border: "none", outline: "none", padding: "9px 0", fontSize: 13, width: "100%", background: "transparent" }} />
        </div>
        <Btn tone="primary" size="sm" onClick={onNew}><Plus size={14} className="inline mr-0.5" />추가</Btn>
      </div>
      <div className="flex gap-1.5 mb-2">
        {[["all", "전체"], ["active", "교육중"], ["self", "자가학습"], ["drop", "탈락"]].map(([k, l]) => (
          <button key={k} onClick={() => setFilter(k)}
            style={{
              fontSize: 12, fontWeight: 700, padding: "5px 12px", borderRadius: 999,
              background: filter === k ? C.ink : C.surface, color: filter === k ? "#fff" : C.ink2,
              border: `1px solid ${filter === k ? C.ink : C.line}`,
            }}>{l}</button>
        ))}
      </div>

      {list.length === 0 ? <Empty text="교육생을 추가해 명단을 만들어 보세요." /> : (
        <div style={{ background: C.surface, border: `1px solid ${C.line}`, borderRadius: 14, overflow: "hidden" }}>
          {list.map((s, i) => {
            const r = rateOf(s, att, sessions, rules);
            const out = s.status === "dropped";
            return (
              <button key={s.id} onClick={() => onEdit(s)} className="w-full text-left flex items-center gap-3 px-3 py-2.5"
                style={{ borderTop: i ? `1px solid ${C.line2}` : "none", background: out ? "#FAFAFA" : C.surface }}>
                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-1.5">
                    <span style={{ fontSize: 14, fontWeight: 700, color: out ? C.muted : C.ink, textDecoration: out ? "line-through" : "none" }}>{s.name}</span>
                    <Pill color={C.brandInk} bg={C.brandSoft}>{s.branch}</Pill>
                    {out && <Pill color="#CE3A38" bg="#FBE7E6">탈락</Pill>}
                    {s.status === "self" && <Pill color="#3565C4" bg="#E5EDFB">자가학습</Pill>}
                    {judge(s.examSon, s.examThird) && (() => { const j = judge(s.examSon, s.examThird); return <Pill color={EXAM[j].c} bg={EXAM[j].bg}>{EXAM[j].label}</Pill>; })()}
                  </div>
                  <div style={{ fontSize: 11, color: C.muted, marginTop: 2, fontWeight: 600 }}>
                    유치자 {s.recruiter || "미입력"}
                    {out && s.dropReason ? ` · ${s.dropReason}` : ""}
                  </div>
                </div>
                {!out && (
                  <div className="text-right">
                    <div style={{ fontSize: 15, fontWeight: 800, color: r.rate === null ? C.line : r.rate >= rules.passRate ? "#0B8F63" : "#C97A05", fontVariantNumeric: "tabular-nums" }}>
                      {r.rate === null ? "–" : `${r.rate}%`}
                    </div>
                    <div style={{ fontSize: 10, color: C.muted, fontWeight: 600 }}>결석 {r.absent}</div>
                  </div>
                )}
                <Pencil size={14} color={C.line} />
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

/* ─────────────────────────  통계  ───────────────────────── */
function Stats({ centerStats, stats, students, att, sessions, rules, days, todayKey }) {
  const active = students.filter((s) => s.status !== "dropped");
  const chart = CENTERS.map((c) => ({ name: c.name.replace("센터", ""), rate: centerStats[c.id].rate ?? 0, 접수: centerStats[c.id].total }));

  const risky = active.map((s) => ({ s, r: rateOf(s, att, sessions, rules) }))
    .filter((x) => x.r.absent >= rules.absentLimit || (x.r.rate !== null && x.r.den >= 2 && x.r.rate < rules.passRate))
    .sort((a, b) => (a.r.rate ?? 0) - (b.r.rate ?? 0));

  const trend = days.map((d) => {
    const am = active.filter((s) => ["P", "L"].includes((att[s.id] || {})[skey(d.key, "am")])).length;
    const pm = active.filter((s) => ["P", "L"].includes((att[s.id] || {})[skey(d.key, "pm")])).length;
    return { name: `${d.d}`, 오전: am, 오후: pm, past: d.key <= todayKey };
  }).filter((x) => x.past);

  const examJudged = students.map((s) => judge(s.examSon, s.examThird)).filter(Boolean);
  const examDone = examJudged.length;
  const passed = examJudged.filter((j) => j === "합격").length;
  const examCounts = { 합격: 0, 부분합격: 0, 불합격: 0 };
  examJudged.forEach((j) => examCounts[j]++);

  const Card = ({ title, children, sub }) => (
    <div style={{ background: C.surface, border: `1px solid ${C.line}`, borderRadius: 14, padding: 14, marginBottom: 10 }}>
      <div className="flex items-baseline justify-between mb-2.5">
        <h3 style={{ fontSize: 13.5, fontWeight: 800, letterSpacing: "-0.02em" }}>{title}</h3>
        {sub && <span style={{ fontSize: 11, color: C.muted, fontWeight: 600 }}>{sub}</span>}
      </div>
      {children}
    </div>
  );

  return (
    <div>
      <Card title="지역단 요약">
        <div className="grid grid-cols-3 gap-2">
          {[
            { l: "합격 목표", v: centerStats.all.goal || "–" },
            { l: "합격합계", v: centerStats.all.totalPass },
            { l: "달성률", v: centerStats.all.achieve === null ? "–" : `${centerStats.all.achieve}%` },
            { l: "접수", v: centerStats.all.total },
            { l: "교육중", v: centerStats.all.active },
            { l: "탈락", v: centerStats.all.dropped },
            { l: "평균 출석률", v: centerStats.all.rate === null ? "–" : `${centerStats.all.rate}%` },
            { l: "관리필요", v: centerStats.all.risk },
            { l: "탈락률", v: centerStats.all.total ? `${Math.round((centerStats.all.dropped / centerStats.all.total) * 100)}%` : "–" },
          ].map((x) => (
            <div key={x.l} style={{ background: C.bg, borderRadius: 10, padding: "10px 8px", textAlign: "center" }}>
              <div style={{ fontSize: 18, fontWeight: 800, fontVariantNumeric: "tabular-nums" }}>{x.v}</div>
              <div style={{ fontSize: 10.5, color: C.muted, fontWeight: 600 }}>{x.l}</div>
            </div>
          ))}
        </div>
      </Card>

      <Card title="점포별 목표 달성" sub="합격합계 ÷ 목표">
        {ALL_BRANCHES.map((b) => stats[b]).filter((x) => x.goal > 0).length === 0 ? (
          <p style={{ fontSize: 12.5, color: C.muted }}>설정에서 점포별 합격 목표를 넣으면 여기에 표시됩니다.</p>
        ) : ALL_BRANCHES.map((b) => stats[b]).filter((x) => x.goal > 0)
          .sort((a, b) => b.achieve - a.achieve)
          .map((x) => {
            const col = x.achieve >= 100 ? "#0B8F63" : x.achieve >= 70 ? "#C97A05" : "#CE3A38";
            return (
              <div key={x.branch} className="flex items-center gap-2 py-1.5">
                <span style={{ fontSize: 12.5, fontWeight: 700, width: 56 }}>{x.branch}</span>
                <div style={{ flex: 1, height: 8, background: C.line2, borderRadius: 4, overflow: "hidden" }}>
                  <div style={{ width: `${Math.min(100, x.achieve)}%`, height: "100%", background: col }} />
                </div>
                <span style={{ fontSize: 11, color: C.muted, fontWeight: 600, width: 46, textAlign: "right", fontVariantNumeric: "tabular-nums" }}>
                  {x.totalPass}/{x.goal}
                </span>
                <span style={{ fontSize: 12.5, fontWeight: 800, color: col, width: 40, textAlign: "right", fontVariantNumeric: "tabular-nums" }}>
                  {x.achieve}%
                </span>
              </div>
            );
          })}
      </Card>

      <Card title="센터별 평균 출석률" sub={`기준 ${rules.passRate}%`}>
        {chart.map((e) => {
          const col = e.rate >= rules.passRate ? C.brand : "#C97A05";
          return (
            <div key={e.name} className="flex items-center gap-2 py-1.5">
              <span style={{ fontSize: 12.5, fontWeight: 700, width: 34 }}>{e.name}</span>
              <div style={{ flex: 1, height: 9, background: C.line2, borderRadius: 5, overflow: "hidden" }}>
                <div style={{ width: `${Math.min(100, e.rate)}%`, height: "100%", background: col }} />
              </div>
              <span style={{ fontSize: 13, fontWeight: 800, color: col, width: 40, textAlign: "right", fontVariantNumeric: "tabular-nums" }}>{e.rate}%</span>
            </div>
          );
        })}
      </Card>

      {trend.length > 0 && (
        <Card title="일자별 출석 인원" sub="오전 / 오후">
          <div style={{ display: "flex", alignItems: "flex-end", gap: 6, height: 120, paddingTop: 6 }}>
            {trend.map((t) => {
              const mx = Math.max(1, ...trend.map((x) => Math.max(x.오전, x.오후)));
              return (
                <div key={t.name} style={{ flex: 1, textAlign: "center" }}>
                  <div style={{ display: "flex", alignItems: "flex-end", justifyContent: "center", gap: 2, height: 92 }}>
                    <div style={{ width: 8, height: `${(t.오전 / mx) * 100}%`, background: C.brand, borderRadius: "3px 3px 0 0" }} />
                    <div style={{ width: 8, height: `${(t.오후 / mx) * 100}%`, background: "#7FBFB6", borderRadius: "3px 3px 0 0" }} />
                  </div>
                  <div style={{ fontSize: 10, color: C.muted, fontWeight: 700, marginTop: 4 }}>{t.name}</div>
                </div>
              );
            })}
          </div>
        </Card>
      )}

      <Card title="관리 필요 교육생" sub={`결석 ${rules.absentLimit}회 이상 또는 출석률 ${rules.passRate}% 미만`}>
        {risky.length === 0 ? (
          <p style={{ fontSize: 12.5, color: C.muted }}>해당하는 교육생이 없습니다.</p>
        ) : risky.slice(0, 12).map(({ s, r }) => (
          <div key={s.id} className="flex items-center justify-between py-1.5" style={{ borderBottom: `1px solid ${C.line2}` }}>
            <div>
              <span style={{ fontSize: 13, fontWeight: 700 }}>{s.name}</span>
              <span style={{ fontSize: 11, color: C.muted, fontWeight: 600 }}> · {s.branch}</span>
            </div>
            <div className="flex gap-1.5">
              <Pill color="#CE3A38" bg="#FBE7E6">결석 {r.absent}</Pill>
              <Pill color="#C97A05" bg="#FBF0DD">{r.rate ?? "–"}%</Pill>
            </div>
          </div>
        ))}
      </Card>

      <Card title="점포별 순위" sub="출석률 기준">
        {ALL_BRANCHES.map((b) => stats[b]).filter((x) => x.active > 0)
          .sort((a, b) => (b.rate ?? -1) - (a.rate ?? -1))
          .map((x, i) => (
            <div key={x.branch} className="flex items-center gap-2 py-1.5" style={{ borderBottom: `1px solid ${C.line2}` }}>
              <span style={{ fontSize: 11, fontWeight: 800, color: i < 3 ? C.brand : C.line, width: 18, fontVariantNumeric: "tabular-nums" }}>{i + 1}</span>
              <span style={{ fontSize: 13, fontWeight: 700, flex: 1 }}>{x.branch}</span>
              <span style={{ fontSize: 11, color: C.muted, fontWeight: 600 }}>접수 {x.total} · 탈락 {x.dropped}</span>
              <span style={{ fontSize: 13, fontWeight: 800, color: (x.rate ?? 0) >= rules.passRate ? "#0B8F63" : "#C97A05", width: 42, textAlign: "right", fontVariantNumeric: "tabular-nums" }}>
                {x.rate === null ? "–" : `${x.rate}%`}
              </span>
            </div>
          ))}
      </Card>

      <Card title="본시험 결과" sub={`점수 입력 ${examDone}명`}>
        <div className="grid grid-cols-3 gap-2 mb-3">
          {EXAM_ORDER.map((k) => (
            <div key={k} style={{ background: EXAM[k].bg, borderRadius: 10, padding: "9px 6px", textAlign: "center" }}>
              <div style={{ fontSize: 18, fontWeight: 800, color: EXAM[k].c, fontVariantNumeric: "tabular-nums" }}>
                {examCounts[k]}
              </div>
              <div style={{ fontSize: 10.5, color: EXAM[k].c, fontWeight: 700 }}>{EXAM[k].label}</div>
            </div>
          ))}
        </div>
        <div className="flex items-center gap-3">
          <Award size={20} color={C.brand} />
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 12, color: C.ink2, fontWeight: 600 }}>합격률</div>
            <div style={{ height: 7, background: C.line2, borderRadius: 4, marginTop: 4, overflow: "hidden" }}>
              <div style={{ width: `${examDone ? (passed / examDone) * 100 : 0}%`, height: "100%", background: C.brand }} />
            </div>
          </div>
          <span style={{ fontSize: 17, fontWeight: 800, color: C.brand, fontVariantNumeric: "tabular-nums" }}>
            {examDone ? Math.round((passed / examDone) * 100) : 0}%
          </span>
        </div>
        <p style={{ fontSize: 10.5, color: C.muted, marginTop: 8, lineHeight: 1.5 }}>
          손해보험·제3보험 모두 {PASS_MARK}점 이상 합격 · 한 과목만 넘으면 부분합격
        </p>
      </Card>
    </div>
  );
}

/* ─────────────────────────  설정  ───────────────────────── */
function SettingsView({ schedule, setSchedule, rules, setRules, onSeed, onExport, onReset, students, att,
  targets, setTargets, cohort, stats, access, setAccess, onToast, onPaste }) {
  const [pasteMode, setPasteMode] = useState("roster");
  const [pasteText, setPasteText] = useState("");
  const [s, setS] = useState({ ...schedule, excludeDays: (schedule.excludeDays || []).join(",") });
  const [codeDraft, setCodeDraft] = useState(access.code);
  const [adminDraft, setAdminDraft] = useState(access.adminCode || "");
  const days = buildDays({ ...s, excludeDays: parseDays(s.excludeDays) });

  const setT = (branch, field, value) => setTargets((p) => ({
    ...p,
    [cohort]: {
      ...(p[cohort] || {}),
      [branch]: { ...((p[cohort] || {})[branch] || { goal: 0, prePass: 0 }), [field]: value === "" ? "" : +value },
    },
  }));

  const copyPrev = () => {
    const keys = Object.keys(targets).filter((k) => k < cohort).sort();
    const prev = keys[keys.length - 1];
    if (!prev) { onToast("불러올 지난 기수 목표가 없습니다."); return; }
    setTargets((p) => ({ ...p, [cohort]: { ...(p[prev] || {}) } }));
    onToast(`${prev} 목표를 불러왔습니다.`);
  };

  const apply = () => setSchedule({
    year: +s.year, month: +s.month, startDay: +s.startDay, endDay: +s.endDay, examDay: +s.examDay,
    includeWeekends: !!s.includeWeekends, excludeDays: parseDays(s.excludeDays),
    mockExams: schedule.mockExams || [],
  });

  const Card = ({ title, children, sub }) => (
    <div style={{ background: C.surface, border: `1px solid ${C.line}`, borderRadius: 14, padding: 14, marginBottom: 10 }}>
      <h3 style={{ fontSize: 13.5, fontWeight: 800, marginBottom: sub ? 2 : 10, letterSpacing: "-0.02em" }}>{title}</h3>
      {sub && <p style={{ fontSize: 11.5, color: C.muted, marginBottom: 10, lineHeight: 1.5 }}>{sub}</p>}
      {children}
    </div>
  );

  return (
    <div>
      <Card title="이번 달 교육 일정" sub="달마다 교육 기간이 다르면 여기서 바꾸세요. 저장하면 출결표가 새 일정으로 다시 그려집니다.">
        <div className="grid grid-cols-2 gap-x-3">
          <Field label="연도"><input type="number" value={s.year} onChange={(e) => setS({ ...s, year: e.target.value })} style={inputStyle} /></Field>
          <Field label="월"><input type="number" value={s.month} onChange={(e) => setS({ ...s, month: e.target.value })} style={inputStyle} /></Field>
          <Field label="교육 시작일"><input type="number" value={s.startDay} onChange={(e) => setS({ ...s, startDay: e.target.value })} style={inputStyle} /></Field>
          <Field label="교육 종료일"><input type="number" value={s.endDay} onChange={(e) => setS({ ...s, endDay: e.target.value })} style={inputStyle} /></Field>
          <Field label="시험일"><input type="number" value={s.examDay} onChange={(e) => setS({ ...s, examDay: e.target.value })} style={inputStyle} /></Field>
          <Field label="쉬는 날 (일자, 쉼표)"><input value={s.excludeDays} onChange={(e) => setS({ ...s, excludeDays: e.target.value })} placeholder="예: 15,18" style={inputStyle} /></Field>
        </div>
        <label className="flex items-center gap-2 mb-3" style={{ fontSize: 13, fontWeight: 600, color: C.ink2 }}>
          <input type="checkbox" checked={!!s.includeWeekends} onChange={(e) => setS({ ...s, includeWeekends: e.target.checked })} />
          주말도 교육일로 포함
        </label>
        <div style={{ background: C.bg, borderRadius: 10, padding: "9px 11px", fontSize: 11.5, color: C.ink2, fontWeight: 600, marginBottom: 10, lineHeight: 1.6 }}>
          교육일 {days.length}일 · 총 {days.length * 2}교시<br />
          {days.map((d) => `${d.d}(${DOW[d.dow]})`).join(" · ") || "해당 기간에 교육일이 없습니다."}
        </div>
        <Btn tone="primary" full onClick={apply}>일정 저장</Btn>
      </Card>

      <Card title="모의고사 일정" sub="회차를 추가하고 실시 일자를 넣으면 모의고사 탭에 그대로 나옵니다.">
        {(schedule.mockExams || []).length === 0 && (
          <p style={{ fontSize: 12.5, color: C.muted, marginBottom: 10 }}>등록된 회차가 없습니다.</p>
        )}
        {(schedule.mockExams || []).map((m, i) => (
          <div key={m.id} className="flex items-center gap-2 mb-2">
            <input value={m.label} onChange={(e) => setSchedule({
              ...schedule, mockExams: schedule.mockExams.map((x) => x.id === m.id ? { ...x, label: e.target.value } : x),
            })} style={{ ...inputStyle, width: 68, padding: "8px 8px", fontSize: 13, textAlign: "center" }} />
            <div className="flex items-center gap-1" style={{ flex: 1 }}>
              <span style={{ fontSize: 12.5, color: C.muted, fontWeight: 600 }}>{schedule.month}월</span>
              <input type="number" value={m.day} onChange={(e) => setSchedule({
                ...schedule, mockExams: schedule.mockExams.map((x) => x.id === m.id ? { ...x, day: +e.target.value } : x),
              })} style={{ ...inputStyle, width: 60, padding: "8px 6px", fontSize: 13, textAlign: "center" }} />
              <span style={{ fontSize: 12.5, color: C.muted, fontWeight: 600 }}>일</span>
            </div>
            <select value={m.half || "pm"} onChange={(e) => setSchedule({
              ...schedule, mockExams: schedule.mockExams.map((x) => x.id === m.id ? { ...x, half: e.target.value } : x),
            })} style={{ ...inputStyle, width: 74, padding: "8px 6px", fontSize: 12.5 }}>
              <option value="am">오전</option>
              <option value="pm">오후</option>
            </select>
            <button onClick={() => setSchedule({ ...schedule, mockExams: schedule.mockExams.filter((x) => x.id !== m.id) })}
              style={{ color: "#CE3A38", padding: 5 }}><Trash2 size={15} /></button>
          </div>
        ))}
        <Btn full tone="soft" onClick={() => setSchedule({
          ...schedule,
          mockExams: [...(schedule.mockExams || []), {
            id: uid(), label: `${(schedule.mockExams || []).length + 1}차`,
            day: schedule.startDay, half: "pm",
          }],
        })}><Plus size={14} className="inline mr-1" />회차 추가</Btn>
      </Card>

      <Card title="엑셀 붙여넣기" sub="매달 명단과 목표를 이걸로 갈아끼우면 됩니다. 파일 교체가 필요 없습니다.">
        <div className="flex gap-1.5 mb-2">
          {[["roster", "교육생 명단"], ["targets", "목표·기합격"]].map(([k, l]) => (
            <button key={k} onClick={() => setPasteMode(k)} className="flex-1"
              style={{
                fontSize: 12.5, fontWeight: 700, padding: "8px 0", borderRadius: 10,
                background: pasteMode === k ? C.brand : C.surface, color: pasteMode === k ? "#fff" : C.ink2,
                border: `1px solid ${pasteMode === k ? C.brand : C.line}`,
              }}>{l}</button>
          ))}
        </div>
        <div style={{ background: C.bg, borderRadius: 10, padding: "9px 11px", fontSize: 11.5, color: C.ink2, lineHeight: 1.7, marginBottom: 8 }}>
          {pasteMode === "roster" ? (
            <>엑셀에서 <b>지점 · 교육생 · 유치자 · (출결) · 비고</b> 순서로 된 줄을 복사해 붙여넣으세요.
              출결 칸의 1은 출석, 0은 결석으로 들어갑니다. 비고에 <b>탈락</b>이나 <b>자가학습</b>이 있으면 그대로 반영됩니다.</>
          ) : (
            <>한 줄에 <b>점포 · 목표 · 기합격</b> 순서로 붙여넣으세요. 기합격은 비워도 됩니다.
              지역단·센터 줄은 자동으로 건너뜁니다.</>
          )}
        </div>
        <textarea value={pasteText} onChange={(e) => setPasteText(e.target.value)} rows={5}
          placeholder={pasteMode === "roster" ? "새인천\t홍길동\t최진희\t1\t1\t0\t1" : "새인천\t3\t3"}
          style={{ ...inputStyle, fontSize: 12, fontFamily: "ui-monospace, monospace", resize: "none" }} />
        <div className="flex gap-2 mt-2">
          <Btn full onClick={() => setPasteText("")}>지우기</Btn>
          <Btn full tone="primary" disabled={!pasteText.trim()}
            onClick={() => { onPaste(pasteMode, pasteText); setPasteText(""); }}>적용</Btn>
        </div>
        {pasteMode === "roster" && (
          <p style={{ fontSize: 11, color: "#C97A05", marginTop: 8, lineHeight: 1.6, fontWeight: 600 }}>
            적용하면 이번 기수({cohort})의 기존 명단과 출결이 붙여넣은 내용으로 교체됩니다.
          </p>
        )}
      </Card>

      <Card title="점포별 합격 목표" sub={`${cohort} 기준. 기합격은 이번 달 시험 전에 이미 합격해 둔 인원입니다.`}>
        <div className="flex items-center gap-2 px-1 mb-1" style={{ fontSize: 10.5, color: C.muted, fontWeight: 700 }}>
          <span style={{ flex: 1 }}>점포</span>
          <span style={{ width: 62, textAlign: "center" }}>목표</span>
          <span style={{ width: 62, textAlign: "center" }}>기합격</span>
          <span style={{ width: 40, textAlign: "center" }}>합계</span>
        </div>
        {CENTERS.map((c) => (
          <div key={c.id} style={{ marginBottom: 8 }}>
            <div style={{ fontSize: 11.5, fontWeight: 800, color: C.brandInk, margin: "6px 0 3px" }}>{c.name}</div>
            {c.branches.map((b) => {
              const t = (targets[cohort] || {})[b] || {};
              const totalPass = (+t.prePass || 0) + (stats[b]?.ontime || 0);
              return (
                <div key={b} className="flex items-center gap-2 py-1">
                  <span style={{ flex: 1, fontSize: 13, fontWeight: 700 }}>{b}</span>
                  <input type="number" inputMode="numeric" value={t.goal ?? ""} placeholder="0"
                    onChange={(e) => setT(b, "goal", e.target.value)}
                    style={{ ...inputStyle, width: 62, padding: "7px 4px", textAlign: "center", fontSize: 13.5, fontWeight: 700 }} />
                  <input type="number" inputMode="numeric" value={t.prePass ?? ""} placeholder="0"
                    onChange={(e) => setT(b, "prePass", e.target.value)}
                    style={{ ...inputStyle, width: 62, padding: "7px 4px", textAlign: "center", fontSize: 13.5, fontWeight: 700 }} />
                  <span style={{ width: 40, textAlign: "center", fontSize: 13.5, fontWeight: 800, color: C.brand, fontVariantNumeric: "tabular-nums" }}>
                    {totalPass}
                  </span>
                </div>
              );
            })}
          </div>
        ))}
        <Btn full tone="soft" onClick={copyPrev}><RotateCcw size={14} className="inline mr-1" />지난 기수 목표 불러오기</Btn>
      </Card>

      <Card title="접속 코드" sub="일반 코드는 출결 체크와 교육생 정보 수정까지, 관리자 코드는 설정·목표·삭제까지 가능합니다.">
        <label className="flex items-center gap-2 mb-3" style={{ fontSize: 13, fontWeight: 600, color: C.ink2 }}>
          <input type="checkbox" checked={!!access.enabled}
            onChange={(e) => setAccess({ ...access, enabled: e.target.checked })} />
          접속 코드 사용
        </label>
        <div className="grid grid-cols-2 gap-3">
          <Field label="일반 코드">
            <input inputMode="numeric" value={codeDraft} maxLength={8}
              onChange={(e) => setCodeDraft(e.target.value.replace(/\D/g, ""))}
              style={{ ...inputStyle, textAlign: "center", fontSize: 20, fontWeight: 800, letterSpacing: "0.2em" }} />
          </Field>
          <Field label="관리자 코드">
            <input inputMode="numeric" value={adminDraft} maxLength={8}
              onChange={(e) => setAdminDraft(e.target.value.replace(/\D/g, ""))}
              style={{ ...inputStyle, textAlign: "center", fontSize: 20, fontWeight: 800, letterSpacing: "0.2em" }} />
          </Field>
        </div>
        <Btn full tone="primary" disabled={codeDraft.length < 4 || adminDraft.length < 4 || codeDraft === adminDraft}
          onClick={() => { setAccess({ ...access, code: codeDraft, adminCode: adminDraft }); onToast("접속 코드를 바꿨습니다."); }}>
          코드 저장
        </Btn>
        {codeDraft === adminDraft && (
          <p style={{ fontSize: 11, color: "#CE3A38", marginTop: 8, fontWeight: 600 }}>
            두 코드는 서로 달라야 합니다.
          </p>
        )}
        <p style={{ fontSize: 11, color: C.muted, marginTop: 9, lineHeight: 1.6 }}>
          잠금 화면에서 관리자 코드를 넣으면 바로 관리자로 들어옵니다. 이 잠금은 기기 안에서만 동작하니
          대외비 자료 보호는 기기 잠금과 함께 쓰세요. 코드를 잊으면 데이터를 지우고 다시 시작해야 합니다.
        </p>
      </Card>

      <Card title="수료 기준" sub="기준에 못 미치면 명단과 출결표에 관리필요 표시가 뜹니다.">
        <div className="grid grid-cols-2 gap-x-3">
          <Field label="수료 출석률 (%)">
            <input type="number" value={rules.passRate} onChange={(e) => setRules({ ...rules, passRate: +e.target.value })} style={inputStyle} />
          </Field>
          <Field label="경고 결석 횟수">
            <input type="number" value={rules.absentLimit} onChange={(e) => setRules({ ...rules, absentLimit: +e.target.value })} style={inputStyle} />
          </Field>
        </div>
        <label className="flex items-center gap-2" style={{ fontSize: 13, fontWeight: 600, color: C.ink2 }}>
          <input type="checkbox" checked={rules.lateAsPresent} onChange={(e) => setRules({ ...rules, lateAsPresent: e.target.checked })} />
          지각도 출석으로 계산
        </label>
        <p style={{ fontSize: 11, color: C.muted, marginTop: 8, lineHeight: 1.5 }}>공결은 출석률 계산에서 제외됩니다.</p>
      </Card>

      <Card title="함께 쓰기" sub="이 앱의 자료는 링크를 여는 모든 사람이 같이 보고 같이 고칩니다.">
        <ul style={{ fontSize: 12, color: C.ink2, lineHeight: 1.75, paddingLeft: 16, listStyle: "disc" }}>
          <li>입력하면 몇 초 뒤 자동 저장되고, 다른 사람 화면에는 12초 안에 반영됩니다.</li>
          <li>바로 확인하려면 화면 위 <b>동기화</b> 버튼을 누르세요.</li>
          <li>서로 다른 칸을 고치면 둘 다 남지만, <b>같은 칸을 동시에 고치면 나중에 저장한 쪽이 남습니다.</b></li>
          <li>링크를 가진 사람은 누구나 볼 수 있습니다. 교육생 실명이 들어 있으니 링크는 필요한 분에게만 보내세요.</li>
        </ul>
      </Card>

      <Card title="데이터">
        <div className="flex flex-col gap-2">
          <Btn full onClick={onExport}><Download size={14} className="inline mr-1" />엑셀(CSV)로 내보내기</Btn>
          <Btn full tone="soft" onClick={onSeed}><RotateCcw size={14} className="inline mr-1" />업로드 양식 데이터 다시 불러오기</Btn>
          <Btn full tone="danger" onClick={onReset}><Trash2 size={14} className="inline mr-1" />이번 기수 데이터 지우기</Btn>
        </div>
        <p style={{ fontSize: 11, color: C.muted, marginTop: 10, lineHeight: 1.6 }}>
          입력한 내용은 기기에 자동 저장됩니다. 전체 교육생 {students.length}명 · 출결 기록 {Object.keys(att).length}건.
        </p>
      </Card>

      <Card title="조직도">
        {CENTERS.map((c) => (
          <div key={c.id} style={{ marginBottom: 10 }}>
            <div style={{ fontSize: 12.5, fontWeight: 800, color: C.brandInk, marginBottom: 4 }}>{c.name}</div>
            <div className="flex flex-wrap gap-1">
              {c.branches.map((b) => <Pill key={b} color={C.ink2} bg={C.bg}>{b}</Pill>)}
            </div>
          </div>
        ))}
      </Card>
    </div>
  );
}
function parseDays(v) {
  return String(v || "").split(",").map((x) => parseInt(x.trim(), 10)).filter((n) => !isNaN(n));
}

/* ─────────────────────────  교육생 모달  ───────────────────────── */
function StudentModal({ editing, onClose, onSave, onDelete, canDelete }) {
  const [f, setF] = useState(editing);
  useEffect(() => setF(editing), [editing]);
  if (!f) return null;
  const set = (k, v) => setF({ ...f, [k]: v });

  return (
    <Modal open onClose={onClose} title={editing?.name ? `${editing.name} 정보` : "교육생 추가"}>
      <div className="grid grid-cols-2 gap-x-3">
        <Field label="이름"><input value={f.name} onChange={(e) => set("name", e.target.value)} style={inputStyle} placeholder="홍길동" /></Field>
        <Field label="점포">
          <select value={f.branch} onChange={(e) => set("branch", e.target.value)} style={inputStyle}>
            {CENTERS.map((c) => (
              <optgroup key={c.id} label={c.name}>{c.branches.map((b) => <option key={b}>{b}</option>)}</optgroup>
            ))}
          </select>
        </Field>
        <Field label="유치자"><input value={f.recruiter} onChange={(e) => set("recruiter", e.target.value)} style={inputStyle} placeholder="유치자명" /></Field>
        <Field label="상태">
          <select value={f.status} onChange={(e) => set("status", e.target.value)} style={inputStyle}>
            <option value="active">교육중</option>
            <option value="self">자가학습</option>
            <option value="dropped">탈락</option>
          </select>
        </Field>
      </div>

      {f.status === "dropped" && (
        <div style={{ background: "#FDF3F2", borderRadius: 10, padding: 11, marginBottom: 12 }}>
          <Field label="탈락 사유">
            <select value={f.dropReason} onChange={(e) => set("dropReason", e.target.value)} style={inputStyle}>
              <option value="">선택</option>
              {["본인 포기", "출석 미달", "연락 두절", "타사 이동", "개인 사정", "시험 불합격", "기타"].map((r) => <option key={r}>{r}</option>)}
            </select>
          </Field>
          <Field label="탈락일"><input type="date" value={f.dropDate} onChange={(e) => set("dropDate", e.target.value)} style={inputStyle} /></Field>
        </div>
      )}

      <div style={{ background: C.bg, borderRadius: 12, padding: 12, marginBottom: 12 }}>
        <div className="flex items-center justify-between mb-2">
          <span style={{ fontSize: 12.5, fontWeight: 800 }}>본시험 점수</span>
          {(() => { const j = judge(f.examSon, f.examThird); return (
            <span style={{ fontSize: 11, fontWeight: 800, color: EXAM[j].c, background: EXAM[j].bg, padding: "3px 9px", borderRadius: 999 }}>
              {j ? EXAM[j].label : "점수 입력 전"}
            </span>
          ); })()}
        </div>
        <div className="grid grid-cols-2 gap-3">
          {[["examSon", "손해보험"], ["examThird", "제3보험"]].map(([k, l]) => {
            const n = numOrNull(f[k]), bad = n !== null && n < PASS_MARK;
            return (
              <label key={k}>
                <span style={{ fontSize: 11.5, fontWeight: 700, color: C.ink2, display: "block", marginBottom: 4 }}>{l}</span>
                <input type="number" inputMode="numeric" min={0} max={100} value={f[k] ?? ""}
                  onChange={(e) => set(k, e.target.value === "" ? "" : Math.max(0, Math.min(100, Number(e.target.value))))}
                  placeholder="0–100"
                  style={{
                    ...inputStyle, textAlign: "center", fontWeight: 700, fontSize: 16,
                    border: `1px solid ${n === null ? C.line : bad ? "#F0C3C1" : "#B7E2CE"}`,
                    background: n === null ? C.surface : bad ? "#FDF3F2" : "#F1FAF5",
                    color: n === null ? C.ink : bad ? "#CE3A38" : "#0B8F63",
                  }} />
              </label>
            );
          })}
        </div>
        <p style={{ fontSize: 10.5, color: C.muted, marginTop: 7, lineHeight: 1.5 }}>
          두 과목 모두 {PASS_MARK}점 이상 합격 · 한 과목만 넘으면 부분합격 · 둘 다 미만이면 불합격
        </p>
      </div>

      <Field label="메모">
        <textarea value={f.memo} onChange={(e) => set("memo", e.target.value)} rows={2}
          style={{ ...inputStyle, resize: "none" }} placeholder="상담 내용, 특이사항" />
      </Field>

      <div className="flex gap-2 mt-2">
        {canDelete && <Btn tone="danger" onClick={() => onDelete(f.id)}><Trash2 size={14} /></Btn>}
        <Btn tone="primary" full disabled={!f.name.trim()} onClick={() => onSave({ ...f, name: f.name.trim() })}>
          <Check size={14} className="inline mr-1" />저장
        </Btn>
      </div>
    </Modal>
  );
}

function Empty({ text }) {
  return (
    <div style={{ background: C.surface, border: `1px dashed ${C.line}`, borderRadius: 14, padding: "30px 20px", textAlign: "center" }}>
      <p style={{ fontSize: 13, color: C.muted, lineHeight: 1.6, whiteSpace: "pre-line" }}>{text}</p>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
document.getElementById("boot").style.display = "none";
</script>
</body>
</html>
